      - name: api1
        paths:
          - /api1
        strip_path: true
        preserve_host: false

  - name: backend-service-2
    url: https://backend-service-2-uat-1234567890.asia-southeast1.run.app
    routes:
      - name: api2
        paths:
          - /api2
        strip_path: true
        preserve_host: false