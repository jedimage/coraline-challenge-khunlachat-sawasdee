variables:
  SERVICE_NAME: "kong-api-gw"
  ARTIFACT_REGISTRY_REPOSITORY: "kong-api-gw"
  IMAGE_REPO: "asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REGISTRY_REPOSITORY}/${SERVICE_NAME}"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - build
  - deploy-cloudrun

.build:
  stage: build
  tags:
    - ${RUNNER_TAG}
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - echo "${PROJECT_SA_KEY}" > /kaniko/key.json
    - echo "key.json saved bytes = $(wc -c /kaniko/key.json)"
    - export GOOGLE_APPLICATION_CREDENTIALS=/kaniko/key.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --build-arg "KONG_CONFIG=${KONG_CONFIG}" \
        --destination "${IMAGE_REPO}:${ENV_NAME}-${CI_COMMIT_SHA}" \
        --destination "${IMAGE_REPO}:${IMAGE_TAG}" \
        --cleanup

.deploy-cloudrun:
  stage: deploy-cloudrun
  tags:
    - ${RUNNER_TAG}
  image: google/cloud-sdk:slim
  script:
    - echo "${PROJECT_SA_KEY}" > key.json
    - gcloud auth activate-service-account --key-file=key.json
    - gcloud config set project "${GCP_PROJECT}"
    - |
      gcloud run deploy "${SERVICE_NAME}-${ENV_NAME}" \
        --image "${IMAGE_REPO}:${ENV_NAME}-${CI_COMMIT_SHA}" \
        --region "${GCP_REGION}" \
        --platform managed \
        --quiet
  environment:
    name: ${ENV_NAME}

.dev:
  variables:
    ENV_NAME: "develop"
    KONG_CONFIG: "kong/kong.dev.yml"
    IMAGE_TAG: "develop-latest"
    RUNNER_TAG: "project-builder-tag"
    GCP_PROJECT: "example-project-nonprod"
    PROJECT_SA_KEY: $GCP_NONPROD_SA_KEY
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPESOURCE == "push"'
      changes:
        - kong/kong.dev.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

build-dev:
  extends:
    - .build
    - .dev

deploy-dev:
  extends:
    - .deploy-cloudrun
    - .dev
  needs:
    - build-dev

.uat:
  variables:
    ENV_NAME: "uat"
    KONG_CONFIG: "kong/kong.uat.yml"
    IMAGE_TAG: "uat-latest"
    RUNNER_TAG: "project-builder-tag"
    GCP_PROJECT: "example-project-nonprod"
    PROJECT_SA_KEY: $GCP_NONPROD_SA_KEY
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPESOURCE == "push"'
      changes:
        - kong/kong.uat.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

build-uat:
  extends:
    - .build
    - .uat

deploy-uat:
  extends:
    - .deploy-cloudrun
    - .uat
  needs:
    - build-uat

.prod:
  variables:
    ENV_NAME: "prod"
    KONG_CONFIG: "kong/kong.prod.yml"
    IMAGE_TAG: "prod-latest"
    RUNNER_TAG: "project-builder-tag"
    GCP_PROJECT: "example-project-prod"
    PROJECT_SA_KEY: $GCP_PROD_SA_KEY
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPESOURCE == "push"'
      changes:
        - kong/kong.prod.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

build-prod:
  extends:
    - .build
    - .prod

deploy-prod:
  extends:
    - .deploy-cloudrun
    - .prod
  rules:
    - when: never
  needs:
    - build-prod
